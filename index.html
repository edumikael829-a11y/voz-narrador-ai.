<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voz Narrador AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: #10111b;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 550px;
    margin: 30px auto;
    background: #1c1e2d;
    padding: 25px;
    border-radius: 18px;
}

h1 {
    text-align: center;
    color: #8b7cff;
}

p {
    color: #bbb;
    text-align: center;
}

textarea {
    width: 100%;
    height: 220px;
    background: #10111b;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 15px;
    font-size: 16px;
    resize: vertical;
}

#counter {
    text-align: right;
    font-size: 12px;
    margin: 8px 0 15px;
}

button, .download {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
}

#gerar {
    background: #7563ff;
    color: white;
}

.download {
    background: #18a66a;
    color: white;
}

button:disabled {
    opacity: 0.6;
}

#status {
    text-align: center;
    margin-top: 18px;
    color: #b9adff;
}

#result {
    display: none;
    margin-top: 20px;
}

audio {
    width: 100%;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎙️ Voz Narrador AI</h1>
<p>Transforme seus roteiros em narrações.</p>

<textarea id="texto" maxlength="5000"
placeholder="Cole ou digite seu roteiro aqui..."></textarea>

<div id="counter">0 / 5000 caracteres</div>

<button id="gerar" onclick="gerarAudio()">
GERAR NARRAÇÃO
</button>

<div id="status"></div>

<div id="result">

<audio id="audio" controls></audio>

<a id="download" class="download" download="narracao.mp3">
⬇️ BAIXAR ÁUDIO MP3
</a>

</div>

</div>

<script>
const texto = document.getElementById("texto");

texto.addEventListener("input", () => {
    document.getElementById("counter").textContent =
        texto.value.length + " / 5000 caracteres";
});

async function gerarAudio() {

    const conteudo = texto.value.trim();
    const botao = document.getElementById("gerar");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    if (!conteudo) {
        status.textContent = "Digite seu roteiro primeiro.";
        return;
    }

    botao.disabled = true;
    botao.textContent = "GERANDO...";
    status.textContent = "Preparando sua narração...";
    result.style.display = "none";

    try {

        const resposta = await fetch("/api/tts", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: conteudo })
        });

        if (!resposta.ok) {
            let mensagem = "Erro na geração.";
            try {
                const erro = await resposta.json();
                mensagem = erro.detail || mensagem;
            } catch {}
            throw new Error(mensagem);
        }

        const blob = await resposta.blob();
        const url = URL.createObjectURL(blob);

        document.getElementById("audio").src = url;
        document.getElementById("download").href = url;

        result.style.display = "block";
        status.textContent = "Narração gerada com sucesso!";

    } catch (erro) {

        status.textContent = "Erro: " + erro.message;

    } finally {

        botao.disabled = false;
        botao.textContent = "GERAR NARRAÇÃO";

    }
}
</script>

</body>
</html>
